name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto
          POSTGRES_DB: crypto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crypto" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      CRYPTO_TEST_DATABASE_URL: postgresql://crypto:crypto@localhost:5432/crypto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src dags tests scripts
      - run: python -m pytest -v
